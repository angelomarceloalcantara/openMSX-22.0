# ============================================================================
# .github/workflows/build-windows-test-upstream.yml
#
# TESTE DE DIAGNÓSTICO (v3): compila a tag RELEASE_21_0 do openMSX oficial,
# mas agora com um passo extra ANTES do Meson que lista o conteúdo real de
# src/meson.build (primeiras linhas) e de src/console/ no disco do runner.
#
# Isso elimina qualquer suposição: vamos ver com os próprios olhos se
# console/CommandConsole.cc existe ou não na árvore checked-out, e o que
# src/meson.build realmente contém na linha 1.
# ============================================================================

name: TESTE - Build Windows (openMSX RELEASE_21_0)

on:
  workflow_dispatch: {}

jobs:
  build-windows-upstream-release:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout do repositório OFICIAL openMSX/openMSX (tag RELEASE_21_0)
        uses: actions/checkout@v4
        with:
          repository: openMSX/openMSX
          ref: RELEASE_21_0
          fetch-depth: 0

      - name: DIAGNÓSTICO - inspecionar src/meson.build e src/console
        run: |
          echo "===== git status ====="
          git status
          echo ""
          echo "===== git log -1 ====="
          git log -1
          echo ""
          echo "===== primeiras 10 linhas de src/meson.build ====="
          head -n 10 src/meson.build
          echo ""
          echo "===== conteúdo de src/console/ (se existir) ====="
          ls -la src/console/ 2>&1 || echo "PASTA src/console NAO EXISTE"
          echo ""
          echo "===== procurando CommandConsole em todo o repo ====="
          find . -iname "*CommandConsole*" 2>&1
          echo ""
          echo "===== procurando ImGuiConsole em todo o repo ====="
          find . -iname "*ImGuiConsole*" 2>&1
          echo ""
          echo "===== quantas vezes 'CommandConsole' aparece em src/meson.build ====="
          grep -n "CommandConsole" src/meson.build || echo "não aparece"

      - name: Configurar MSYS2 + MinGW64 e instalar dependências
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-tcl
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-openal
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libtheora
            mingw-w64-x86_64-freetype

      - name: Configurar build (Meson)
        run: meson setup build --buildtype=release

      - name: Compilar (Ninja via Meson)
        run: meson compile -C build

      - name: Confirmar binário gerado
        run: |
          ls -la build/openmsx.exe
          echo "SUCESSO: o pipeline MSYS2/Meson funciona na release estável."
