# ============================================================================
# .github/workflows/build-windows-test-upstream.yml
#
# TESTE DE DIAGNÓSTICO (v2): compila a tag ESTÁVEL RELEASE_21_0 do
# repositório oficial openMSX/openMSX, em vez da branch master.
#
# Por quê: testamos o master oficial e ele FALHOU com o mesmo erro do fork
# (console/CommandConsole.cc não existe). Isso indica que o master está,
# neste momento, num estado de transição/instável (o console antigo Tcl
# está sendo substituído por um novo console baseado em ImGui, e o
# src/meson.build aparentemente ainda não foi atualizado para refletir
# isso). Uma release taggeada não deveria sofrer desse problema.
#
# Se ESTE workflow compilar com sucesso: confirma que o pipeline
# MSYS2/Meson está correto, e que o problema é branch/commit específico
# (master instável), não do seu fork nem do workflow.
# ============================================================================

name: TESTE - Build Windows (openMSX RELEASE_21_0)

on:
  workflow_dispatch: {}

jobs:
  build-windows-upstream-release:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout do repositório OFICIAL openMSX/openMSX (tag RELEASE_21_0)
        uses: actions/checkout@v4
        with:
          repository: openMSX/openMSX
          ref: RELEASE_21_0
          fetch-depth: 0

      - name: Configurar MSYS2 + MinGW64 e instalar dependências
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-tcl
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-openal
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libtheora
            mingw-w64-x86_64-freetype

      - name: Configurar build (Meson)
        run: meson setup build --buildtype=release

      - name: Compilar (Ninja via Meson)
        run: meson compile -C build

      - name: Confirmar binário gerado
        run: |
          ls -la build/openmsx.exe
          echo "SUCESSO: o pipeline MSYS2/Meson funciona na release estável."
