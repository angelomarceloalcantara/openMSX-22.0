name: Build openMSX (Windows MinGW64)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Configura o MSYS2 no ambiente MINGW64
      - name: Configurar MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-sdl2
            mingw-w64-x86_64-sdl2_ttf
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-tcl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libtheora
            mingw-w64-x86_64-flac
            python3

      # Executa a compilação
      - name: Compilar openMSX
        shell: msys2 {0}
        run: |
          set -e
          
          # Garante a atualização e verificação de pacotes MinGW64
          export MAKE=mingw32-make
          export PKG_CONFIG_PATH="/mingw64/lib/pkgconfig:$PKG_CONFIG_PATH"
          
          # Executa a checagem de dependências
          ./configure
          
          # Compila o projeto utilizando todos os núcleos do processador
          mingw32-make -j$(nproc)
