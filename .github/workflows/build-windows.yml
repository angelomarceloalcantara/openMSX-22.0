name: Build openMSX

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar ambiente MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true

      - name: Instalar Dependências e Compilar
        shell: msys2 {0}
        run: |
          set -e

          # 1. Instala o compilador C++ (g++) e todas as bibliotecas necessárias do MinGW64
          pacman -Sy --noconfirm \
            mingw-w64-x86_64-gcc \
            mingw-w64-x86_64-g++ \
            mingw-w64-x86_64-make \
            mingw-w64-x86_64-pkgconf \
            mingw-w64-x86_64-sdl2 \
            mingw-w64-x86_64-sdl2_ttf \
            mingw-w64-x86_64-freetype \
            mingw-w64-x86_64-glew \
            mingw-w64-x86_64-libpng \
            mingw-w64-x86_64-tcl \
            mingw-w64-x86_64-zlib \
            mingw-w64-x86_64-libogg \
            mingw-w64-x86_64-libvorbis \
            mingw-w64-x86_64-libtheora \
            mingw-w64-x86_64-flac \
            python3

          # 2. Configura as variáveis de ambiente
          export MAKE=mingw32-make
          export PKG_CONFIG_PATH="/mingw64/lib/pkgconfig:$PKG_CONFIG_PATH"

          # 3. Executa a checagem e a compilação
          ./configure
          mingw32-make -j$(nproc)
