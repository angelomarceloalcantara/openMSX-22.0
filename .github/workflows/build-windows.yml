name: Build openMSX (Windows MINGW64)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Configuração do MSYS2 com todas as dependências do MINGW64
      - name: Configurar MSYS2 e Instalar Dependências
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-sdl2
            mingw-w64-x86_64-sdl2_ttf
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-tcl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libtheora
            mingw-w64-x86_64-speex
            mingw-w64-x86_64-flac
            python3

      # Execução da compilação dentro do ambiente MSYS2
      - name: Compilar openMSX
        shell: msys2 {0}
        run: |
          set -e
          export MAKE=mingw32-make
          export PKG_CONFIG_PATH="/mingw64/lib/pkgconfig:$PKG_CONFIG_PATH"
          
          # Rodar a configuração
          ./configure
          
          # Compilar utilizando os núcleos disponíveis
          mingw32-make -j$(nproc)
